<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>わんも〜推し犬総選挙 推移</title>

<style>

@font-face{
  font-family:'PandaBakery';
  src:url('pandabakery.ttf');
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  width:1280px;
  height:720px;
  overflow:hidden;
  background:#efd3a1;
  font-family:'PandaBakery',sans-serif;
}

#bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

#wrap{
  position:absolute;
  inset:0;
  padding:70px 90px;
}

.title{
  font-size:48px;
  color:#6d5b4e;
  margin-bottom:18px;
  letter-spacing:2px;
}

.sub{
  font-size:18px;
  color:#9b8c7e;
  margin-bottom:34px;
  letter-spacing:3px;
}

.line{
  width:100%;
  height:1px;
  background:rgba(120,100,80,.16);
  margin-bottom:38px;
}

.date{
  position:absolute;
  right:90px;
  top:78px;
  font-size:24px;
  color:#8f7c6d;
  letter-spacing:2px;
}

#chart{
  display:flex;
  flex-direction:column;
  gap:18px;
}

.row{
  position:relative;
  height:42px;
  display:flex;
  align-items:center;

  transition:
    transform .9s ease,
    order .9s ease;
}

.rank{
  width:60px;
  font-size:28px;
  color:#6d5b4e;
}

.name{
  width:320px;
  font-size:28px;
  color:#6d5b4e;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.bar-area{
  flex:1;
  height:28px;
  position:relative;
}

.bar{
  position:absolute;
  left:0;
  top:0;

  height:100%;
  width:0%;

  border-radius:999px;

  opacity:.92;

  transition:
    width .9s cubic-bezier(.22,1,.36,1);
}

.score{
  width:180px;
  text-align:right;
  font-size:28px;
  color:#6d5b4e;
  padding-left:18px;
}

.loading{
  color:#7c695c;
  font-size:26px;
}

</style>
</head>

<body>

<img src="haikei.png" id="bg">

<div id="wrap">

  <div class="title">
    わんも〜推し犬総選挙
  </div>

  <div class="sub">
    RANKING TRANSITION
  </div>

  <div class="line"></div>

  <div class="date" id="date">
    LOADING...
  </div>

  <div id="chart">

    <div class="loading">
      データ読み込み中...
    </div>

  </div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycby7mjB5m4pMi63DHtdYOgfEZaQ7TJyAi3mOfndk7WHXyWDsvHeqFFCfdHI6BvjQQoNz6g/exec";

const colors = {

  "ハスキー":"#94b7d4",
  "ポメラニアン":"#efc768",
  "パグ":"#efacbd",
  "ダックスフンド":"#b78662",
  "柴犬":"#d9906e",
  "シュナウザー":"#b6a7d8",
  "チワワ":"#dfb0a5",
  "プードル":"#f2c6e8",
  "マルトイプー":"#d8c0a7",
  "キャバリア":"#d7b59d",
  "ビーグル":"#c9d58f",
  "コーギー":"#f0bb72",
  "サモエド":"#dce8f2",
  "ボーダーコリー":"#9bb9aa",
  "ゴールデンレトリバー":"#e0ba74",
  "パピヨン":"#d8b8f2",
  "ミニチュアピンシャー":"#8f6c5b"

};

const chart = document.getElementById("chart");
const dateEl = document.getElementById("date");

let rawData = [];
const scores = {};
const dogElements = {};

function getColor(name){

  if(colors[name]){
    return colors[name];
  }

  const palette = [
    "#b7c9e2",
    "#f2c4c4",
    "#d9d0b4",
    "#b6d7c9",
    "#d8c1e8",
    "#e8d0b6",
    "#c4d9f2"
  ];

  let hash = 0;

  for(let i = 0; i < name.length; i++){
    hash += name.charCodeAt(i);
  }

  return palette[hash % palette.length];

}

function createRow(name){

  const row = document.createElement("div");

  row.className = "row";

  row.innerHTML = `

    <div class="rank">0</div>

    <div class="name">
      ${name}
    </div>

    <div class="bar-area">
      <div class="bar"></div>
    </div>

    <div class="score">0</div>

  `;

  row.querySelector(".bar").style.background =
    getColor(name);

  dogElements[name] = row;

  chart.appendChild(row);

}

function render(){

  const sorted = Object.entries(scores)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,10);

  const max = sorted[0]?.[1] || 1;

  sorted.forEach(([name,score],index)=>{

    if(!dogElements[name]){
      createRow(name);
    }

    const row = dogElements[name];

    row.style.order = index;

    const width = (score / max) * 100;

    row.querySelector(".rank").textContent =
      index + 1;

    row.querySelector(".score").textContent =
      score.toLocaleString();

    row.querySelector(".bar").style.width =
      width + "%";

  });

}

let i = 0;

function next(){

  if(i >= rawData.length){
    return;
  }

  const [date,name,vote] = rawData[i];

  dateEl.textContent = date;

  if(!scores[name]){
    scores[name] = 0;
  }

  scores[name] += vote;

  render();

  i++;

  setTimeout(next, 850);

}

async function loadData(){

  try{

    const res = await fetch(API_URL);

    const data = await res.json();

    rawData = data
      .filter(v =>
        v["犬種"] &&
        Number(v["票数"]) > 0
      )
      .map(v => [

        String(v["日付"]).trim(),
        String(v["犬種"]).trim(),
        Number(v["票数"])

      ]);

    chart.innerHTML = "";

    next();

  }catch(err){

    console.error(err);

    chart.innerHTML = `

      <div class="loading">
        データの読み込みに失敗しました
      </div>

    `;

  }

}

loadData();

</script>

</body>
</html>
