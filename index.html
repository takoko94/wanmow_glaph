<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280,height=720,user-scalable=no">

<title>わんも〜推し犬総選挙</title>

<style>

@font-face{
  font-family:'PandaBakery';
  src:url('pandabakery.ttf');
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:1280px;
  height:720px;
  overflow:hidden;
}

body{
  position:relative;
  background:#f6dfb8;
  font-family:'PandaBakery',sans-serif;
}

#bg{
  position:absolute;
  inset:0;
  width:1280px;
  height:720px;
  object-fit:cover;
}

#wrap{
  position:absolute;
  inset:0;
  padding:40px 60px;
}

.title{
  font-size:40px;
  color:#6d5b4e;
  line-height:1;
}

.sub{
  margin-top:8px;
  font-size:14px;
  color:#9b8c7e;
  letter-spacing:3px;
}

.line{
  margin-top:18px;
  width:100%;
  height:1px;
  background:rgba(120,100,80,.16);
}

#chart{
  position:absolute;
  left:60px;
  top:118px;

  width:1160px;

  display:flex;
  flex-direction:column;

  gap:4px;
}

/* 固定順位行 */

.row{
  height:24px;

  display:flex;
  align-items:center;
}

/* 順位番号 */

.rank{
  width:40px;

  font-size:17px;
  color:#6d5b4e;
}

/* 犬種 */

.name{
  width:240px;

  font-size:17px;
  color:#6d5b4e;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* バー */

.bar-area{
  flex:1;
  height:15px;
  position:relative;
}

.bar{
  position:absolute;
  left:0;
  top:0;

  width:0%;
  height:100%;

  border-radius:999px;

  opacity:.92;
}

/* 票数 */

.score{
  width:110px;

  text-align:right;

  font-size:17px;
  color:#6d5b4e;

  padding-left:10px;
}

.loading{
  font-size:24px;
  color:#7c695c;
}

</style>
</head>

<body>

<img src="haikei.png" id="bg">

<div id="wrap">

  <div class="title">
    わんも〜推し犬総選挙
  </div>

  <div class="sub">
    LIVE TRANSITION
  </div>

  <div class="line"></div>

  <div id="chart">

    <div class="loading">
      データ読み込み中...
    </div>

  </div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycby7mjB5m4pMi63DHtdYOgfEZaQ7TJyAi3mOfndk7WHXyWDsvHeqFFCfdHI6BvjQQoNz6g/exec";

const chart =
document.getElementById("chart");

const scores = {};

let rawData = [];

const rows = [];

const colors = {

  "ハスキー":"#94b7d4",
  "ポメラニアン":"#efc768",
  "パグ":"#efacbd",
  "ダックスフンド":"#b78662",
  "柴犬":"#d9906e",
  "シュナウザー":"#b6a7d8",
  "チワワ":"#dfb0a5",
  "プードル":"#f2c6e8",
  "キャバリア":"#d7b59d",
  "ビーグル":"#c9d58f",
  "コーギー":"#f0bb72",
  "サモエド":"#dce8f2"

};

function getColor(name){

  if(colors[name]){
    return colors[name];
  }

  const palette = [

    "#b7c9e2",
    "#f2c4c4",
    "#d9d0b4",
    "#b6d7c9",
    "#d8c1e8",
    "#e8d0b6"

  ];

  let hash = 0;

  for(let i = 0; i < name.length; i++){
    hash += name.charCodeAt(i);
  }

  return palette[
    hash % palette.length
  ];

}

/* =========================
固定順位行生成
========================= */

function createRows(){

  chart.innerHTML = "";

  for(let i = 0; i < 19; i++){

    const row =
      document.createElement("div");

    row.className = "row";

    row.innerHTML = `

      <div class="rank">
        ${i + 1}
      </div>

      <div class="name">
        -
      </div>

      <div class="bar-area">

        <div class="bar"></div>

      </div>

      <div class="score">
        0
      </div>

    `;

    chart.appendChild(row);

    rows.push(row);

  }

}

/* =========================
描画
========================= */

function render(){

  const ranking =
    Object.entries(scores)

    .sort((a,b)=>{

      if(b[1] !== a[1]){
        return b[1] - a[1];
      }

      return a[0].localeCompare(
        b[0],
        "ja"
      );

    })

    .slice(0,19);

  const max =
    ranking[0]?.[1] || 1;

  rows.forEach((row,index)=>{

    const data =
      ranking[index];

    if(!data){

      row.querySelector(".name")
        .textContent = "-";

      row.querySelector(".score")
        .textContent = "0";

      row.querySelector(".bar")
        .style.width = "0%";

      return;

    }

    const name =
      data[0];

    const score =
      data[1];

    row.querySelector(".name")
      .textContent =
        name;

    row.querySelector(".score")
      .textContent =
        score.toLocaleString();

    const width =
      (score / max) * 100;

    const bar =
      row.querySelector(".bar");

    const prev =
      Number(
        bar.dataset.score || 0
      );

    const diff =
      score - prev;

    let duration = 0.28;

    if(diff >= 1000){
      duration = 3.8;
    }
    else if(diff >= 500){
      duration = 2.3;
    }
    else if(diff >= 250){
      duration = 1.5;
    }
    else if(diff >= 100){
      duration = 1.0;
    }
    else if(diff >= 50){
      duration = 0.7;
    }
    else if(diff >= 20){
      duration = 0.45;
    }

    bar.style.transition =
      `width ${duration}s ease-out`;

    bar.style.background =
      getColor(name);

    bar.style.width =
      width + "%";

    bar.dataset.score = score;

  });

}

/* =========================
再生
========================= */

let current = 0;

function next(){

  if(current >= rawData.length){
    return;
  }

  const item =
    rawData[current];

  const dog =
    item.dog;

  const votes =
    Number(item.votes || 0);

  if(!scores[dog]){
    scores[dog] = 0;
  }

  scores[dog] += votes;

  render();

  current++;

  setTimeout(next, 90);

}

/* =========================
データ取得
========================= */

async function loadData(){

  try{

    const res =
      await fetch(
        API_URL + "?t=" + Date.now()
      );

    rawData =
      await res.json();

    createRows();

    next();

  }catch(err){

    console.error(err);

    chart.innerHTML = `

      <div class="loading">
        データ取得失敗
      </div>

    `;

  }

}

loadData();

</script>

</body>
</html>
