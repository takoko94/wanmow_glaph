<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>わんも〜推し犬総選挙</title>

<style>

@font-face{
  font-family:'PandaBakery';
  src:url('pandabakery.ttf');
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  width:1280px;
  height:720px;
  overflow:hidden;
  font-family:'PandaBakery',sans-serif;
  background:#efd3a1;
}

#bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

#wrap{
  position:absolute;
  inset:0;
  padding:70px 90px;
}

.title{
  font-size:48px;
  color:#6d5b4e;
  margin-bottom:18px;
  letter-spacing:2px;
}

.sub{
  font-size:18px;
  color:#9b8c7e;
  margin-bottom:34px;
  letter-spacing:3px;
}

.line{
  width:100%;
  height:1px;
  background:rgba(120,100,80,.16);
  margin-bottom:38px;
}

#chart{
  display:flex;
  flex-direction:column;
  gap:18px;
}

.row{
  height:42px;
  display:flex;
  align-items:center;
}

.rank{
  width:60px;
  font-size:28px;
  color:#6d5b4e;
}

.name{
  width:340px;
  font-size:28px;
  color:#6d5b4e;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.bar-area{
  flex:1;
  height:28px;
  position:relative;
}

.bar{
  position:absolute;
  left:0;
  top:0;

  width:0%;
  height:100%;

  border-radius:999px;

  opacity:.92;

  transition:
    width 1.2s cubic-bezier(.22,1,.36,1);
}

.score{
  width:190px;
  text-align:right;
  font-size:28px;
  color:#6d5b4e;
  padding-left:18px;
}

.loading{
  font-size:28px;
  color:#7b6759;
}

</style>
</head>

<body>

<img src="haikei.png" id="bg">

<div id="wrap">

  <div class="title">
    わんも〜推し犬総選挙
  </div>

  <div class="sub">
    LIVE RANKING
  </div>

  <div class="line"></div>

  <div id="chart">

    <div class="loading">
      データ読み込み中...
    </div>

  </div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycby7mjB5m4pMi63DHtdYOgfEZaQ7TJyAi3mOfndk7WHXyWDsvHeqFFCfdHI6BvjQQoNz6g/exec";

const chart =
document.getElementById("chart");

const colors = {

  "ハスキー":"#94b7d4",
  "ポメラニアン":"#efc768",
  "パグ":"#efacbd",
  "ダックスフンド":"#b78662",
  "柴犬":"#d9906e",
  "シュナウザー":"#b6a7d8",
  "チワワ":"#dfb0a5",
  "プードル":"#f2c6e8",
  "キャバリア":"#d7b59d",
  "ビーグル":"#c9d58f",
  "コーギー":"#f0bb72",
  "サモエド":"#dce8f2"

};

function getColor(name){

  if(colors[name]){
    return colors[name];
  }

  const palette = [

    "#b7c9e2",
    "#f2c4c4",
    "#d9d0b4",
    "#b6d7c9",
    "#d8c1e8",
    "#e8d0b6",
    "#c4d9f2"

  ];

  let hash = 0;

  for(let i = 0; i < name.length; i++){
    hash += name.charCodeAt(i);
  }

  return palette[
    hash % palette.length
  ];

}

async function loadRanking(){

  try{

    const res =
      await fetch(
        API_URL + "?t=" + Date.now()
      );

    const data =
      await res.json();

    chart.innerHTML = "";

    const max =
      data[0]?.votes || 1;

    data.forEach(dog => {

      const row =
        document.createElement("div");

      row.className = "row";

      const width =
        (dog.votes / max) * 100;

      row.innerHTML = `

        <div class="rank">
          ${dog.rank}
        </div>

        <div class="name">
          ${dog.name}
        </div>

        <div class="bar-area">

          <div
            class="bar"
            style="
              background:${getColor(dog.name)};
            ">
          </div>

        </div>

        <div class="score">
          ${Number(dog.votes).toLocaleString()}
        </div>

      `;

      chart.appendChild(row);

      requestAnimationFrame(() => {

        row.querySelector(".bar")
          .style.width =
            width + "%";

      });

    });

  }catch(err){

    console.error(err);

    chart.innerHTML = `

      <div class="loading">
        データ取得失敗
      </div>

    `;

  }

}

loadRanking();

setInterval(loadRanking, 30000);

</script>

</body>
</html>
