<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280,height=720,user-scalable=no">

<title>わんも〜推し犬総選挙</title>

<style>

@font-face{
  font-family:'PandaBakery';
  src:url('pandabakery.ttf');
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:1280px;
  height:720px;
  overflow:hidden;
}

body{
  position:relative;
  background:#f6dfb8;
  font-family:'PandaBakery',sans-serif;
}

#bg{
  position:absolute;
  inset:0;
  width:1280px;
  height:720px;
  object-fit:cover;
}

#wrap{
  position:absolute;
  inset:0;
  padding:40px 60px;
}

.title{
  font-size:40px;
  color:#6d5b4e;
  line-height:1;
}

.sub{
  margin-top:8px;
  font-size:14px;
  color:#9b8c7e;
  letter-spacing:3px;
}

.line{
  margin-top:18px;
  width:100%;
  height:1px;
  background:rgba(120,100,80,.16);
}

#chart{
  position:absolute;
  left:60px;
  top:118px;

  width:1160px;

  display:flex;
  flex-direction:column;

  gap:4px;
}

.row{
  height:24px;

  display:flex;
  align-items:center;

  transition:
    transform .28s ease,
    order .28s ease;
}

.rank{
  width:40px;

  font-size:17px;
  color:#6d5b4e;
}

.name{
  width:240px;

  font-size:17px;
  color:#6d5b4e;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.bar-area{
  flex:1;
  height:15px;
  position:relative;
}

.bar{
  position:absolute;
  left:0;
  top:0;

  width:0%;
  height:100%;

  border-radius:999px;

  opacity:.92;
}

.score{
  width:110px;

  text-align:right;

  font-size:17px;
  color:#6d5b4e;

  padding-left:10px;
}

.loading{
  font-size:24px;
  color:#7c695c;
}

</style>
</head>

<body>

<img src="haikei.png" id="bg">

<div id="wrap">

  <div class="title">
    わんも〜推し犬総選挙
  </div>

  <div class="sub">
    LIVE TRANSITION
  </div>

  <div class="line"></div>

  <div id="chart">

    <div class="loading">
      データ読み込み中...
    </div>

  </div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycby7mjB5m4pMi63DHtdYOgfEZaQ7TJyAi3mOfndk7WHXyWDsvHeqFFCfdHI6BvjQQoNz6g/exec";

const chart =
document.getElementById("chart");

const scores = {};
const dogElements = {};

let rawData = [];

const colors = {

  "ハスキー":"#94b7d4",
  "ポメラニアン":"#efc768",
  "パグ":"#efacbd",
  "ダックスフンド":"#b78662",
  "柴犬":"#d9906e",
  "シュナウザー":"#b6a7d8",
  "チワワ":"#dfb0a5",
  "プードル":"#f2c6e8",
  "キャバリア":"#d7b59d",
  "ビーグル":"#c9d58f",
  "コーギー":"#f0bb72",
  "サモエド":"#dce8f2"

};

function getColor(name){

  if(colors[name]){
    return colors[name];
  }

  const palette = [

    "#b7c9e2",
    "#f2c4c4",
    "#d9d0b4",
    "#b6d7c9",
    "#d8c1e8",
    "#e8d0b6"

  ];

  let hash = 0;

  for(let i = 0; i < name.length; i++){
    hash += name.charCodeAt(i);
  }

  return palette[
    hash % palette.length
  ];

}

function createRow(name){

  const row =
    document.createElement("div");

  row.className = "row";

  row.innerHTML = `

    <div class="rank">0</div>

    <div class="name">
      ${name}
    </div>

    <div class="bar-area">

      <div class="bar"></div>

    </div>

    <div class="score">
      0
    </div>

  `;

  row.querySelector(".bar")
    .style.background =
      getColor(name);

  dogElements[name] = row;

  chart.appendChild(row);

}

function render(){

  const sorted =
    Object.entries(scores)

    .sort((a,b)=>{

      if(b[1] !== a[1]){
        return b[1] - a[1];
      }

      return a[0].localeCompare(
        b[0],
        "ja"
      );

    })

    .slice(0,19);

  const max =
    sorted[0]?.[1] || 1;

  sorted.forEach(([name,score],index)=>{

    if(!dogElements[name]){
      createRow(name);
    }

    const row =
      dogElements[name];

    row.style.display = "flex";

    row.style.order = index;

    row.querySelector(".rank")
      .textContent =
        index + 1;

    row.querySelector(".score")
      .textContent =
        score.toLocaleString();

    const width =
      (score / max) * 100;

    const bar =
      row.querySelector(".bar");

    const prev =
      Number(
        bar.dataset.score || 0
      );

    const diff =
      score - prev;

    let duration = 0.18;

    if(diff >= 1000){
      duration = 2.8;
    }
    else if(diff >= 500){
      duration = 1.8;
    }
    else if(diff >= 250){
      duration = 1.2;
    }
    else if(diff >= 100){
      duration = 0.85;
    }
    else if(diff >= 50){
      duration = 0.55;
    }
    else if(diff >= 20){
      duration = 0.35;
    }

    bar.style.transition =
      `width ${duration}s ease-out`;

    bar.style.width =
      width + "%";

    bar.dataset.score = score;

  });

  Object.keys(dogElements).forEach(name => {

    const isVisible =
      sorted.some(v => v[0] === name);

    dogElements[name].style.display =
      isVisible ? "flex" : "none";

  });

}

let current = 0;

function next(){

  if(current >= rawData.length){
    return;
  }

  const item =
    rawData[current];

  const dog =
    item.dog;

  const votes =
    Number(item.votes || 0);

  if(!scores[dog]){
    scores[dog] = 0;
  }

  scores[dog] += votes;

  render();

  current++;

  setTimeout(next, 55);

}

async function loadData(){

  try{

    const res =
      await fetch(
        API_URL + "?t=" + Date.now()
      );

    rawData =
      await res.json();

    chart.innerHTML = "";

    next();

  }catch(err){

    console.error(err);

    chart.innerHTML = `

      <div class="loading">
        データ取得失敗
      </div>

    `;

  }

}

loadData();

</script>

</body>
</html>
